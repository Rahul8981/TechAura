<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAura | Bridging Academia & Industry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="fixed w-full top-0 z-50 bg-[#f3f7fb]/90 backdrop-blur-md border-b border-white/50 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <span class="text-2xl font-extrabold text-indigo-900 font-['Outfit']">TECHAURA</span>
        </div>
        <div class="flex gap-4" id="nav-auth-buttons"></div>
    </nav>

    <main id="app-root" class="mt-20 min-h-[85vh] pb-20"></main>

    <div id="toast" class="fixed bottom-5 right-5 bg-white text-slate-800 px-6 py-4 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 font-semibold border border-slate-100 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-green-500 text-xl"></i>
        <span id="toast-msg"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
